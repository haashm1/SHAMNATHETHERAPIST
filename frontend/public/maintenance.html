<!DOCTYPE html>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #FAF6F0;
      color: #3E2718;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .maintenance-wrapper {
      width: 100%;
      max-width: 960px;
      margin: 0 auto;
    }
    .maintenance-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
      padding: 0 0.5rem;
    }
    .logo-shamna {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 1.7rem;
      font-weight: 700;
      color: #3E2718;
    }
    .logo-tagline {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 1.35rem;
      font-style: italic;
      color: #7A5B47;
    }
    .tagline-badge {
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.18em;
      color: #8E7363;
      text-transform: uppercase;
    }
    .card {
      background: #FFFFFF;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(62, 39, 24, 0.08);
      border: 1px solid rgba(210, 190, 175, 0.5);
    }
    .banner-img {
      width: 100%;
      height: auto;
      display: block;
    }
    .support-panel {
      padding: 2rem 2.5rem;
      background: #FFFFFF;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1.5rem;
      border-top: 1px solid rgba(225, 210, 195, 0.4);
    }
    .support-text h4 {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 1.2rem;
      color: #3E2718;
      margin-bottom: 0.35rem;
    }
    .support-text p {
      font-size: 0.92rem;
      color: #6C5648;
      max-width: 480px;
      line-height: 1.5;
    }
    .actions {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.75rem 1.35rem;
      border-radius: 100px;
      font-size: 0.9rem;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.25s ease;
      cursor: pointer;
    }
    .btn-whatsapp {
      background: #25D366;
      color: #FFFFFF;
      border: none;
    }
    .btn-whatsapp:hover {
      background: #1FB855;
      transform: translateY(-2px);
    }
    .btn-outline {
      background: transparent;
      color: #3E2718;
      border: 1.5px solid rgba(139, 94, 60, 0.35);
    }
    .btn-outline:hover {
      background: #FAF6F0;
      border-color: #8B5E3C;
      transform: translateY(-2px);
    }
    .footer {
      margin-top: 2rem;
      text-align: center;
      font-size: 0.85rem;
      color: #9C8677;
    }
    @media (max-width: 768px) {
      .maintenance-header {
        flex-direction: column;
        align-items: flex-start;
        gap: 0.5rem;
      }
      .support-panel {
        padding: 1.5rem;
        flex-direction: column;
        align-items: flex-start;
      }
      .actions {
        width: 100%;
      }
      .btn {
        width: 100%;
        justify-content: center;
      }
    }

</html>
